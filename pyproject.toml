[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archive-insight"
version = "1.4.2"
description = "Deterministic local ZIP release archive integrity checks"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
archive-insight = "archive_insight.cli:main"

[tool.setuptools.packages.find]
include = ["archive_insight*"]
